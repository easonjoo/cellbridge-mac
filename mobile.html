<style>
/* ═══════════════ DJiPhone Kit v4.0 · iOS 原生设计语言 · 微信式底部 Tab ═══════════════ */
:root{
  --bg:#f2f2f7; --card:#ffffff; --card2:#fbfbfd;
  --line:rgba(60,60,67,.12); --line2:rgba(60,60,67,.08);
  --text:#1c1c1e; --text2:#6e6e73; --text3:#aeaeb2;
  --blue:#007aff; --blue-soft:rgba(0,122,255,.10);
  --green:#34c759; --red:#ff3b30; --orange:#ff9500;
  --bubble-in:#e9e9eb; --bubble-out:linear-gradient(180deg,#1f9bff,#007aff);
  --tab-h:calc(52px + env(safe-area-inset-bottom));
  --nav-h:calc(48px + env(safe-area-inset-top));
  --radius:12px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overscroll-behavior:none}
body{
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Helvetica Neue",sans-serif;
  background:var(--bg);color:var(--text);font-size:16px;line-height:1.45;
  -webkit-font-smoothing:antialiased;user-select:none;
}
input,textarea{user-select:text;font-family:inherit;color:var(--text)}
button{font-family:inherit;border:none;background:none;color:inherit;cursor:pointer}
svg{display:block}

/* ── 顶部导航（iOS large-title 风） ── */
#nav{
  position:fixed;top:0;left:0;right:0;z-index:40;
  padding:env(safe-area-inset-top) 16px 0;
  height:var(--nav-h);
  display:flex;align-items:center;justify-content:space-between;
  background:rgba(242,242,247,.82);
  backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);
  border-bottom:.5px solid var(--line2);
}
.nav-title{font-size:17px;font-weight:700;letter-spacing:-.2px;display:flex;align-items:center;gap:8px}
.nav-title img{width:22px;height:22px;border-radius:5px}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;color:var(--text2);
  background:rgba(120,120,128,.12);border-radius:999px;padding:3px 10px}
.pill .dot{width:7px;height:7px;border-radius:50%;background:var(--text3)}
.pill.ok .dot{background:var(--green)} .pill.ok{color:#248a3d}
.pill.bad .dot{background:var(--red)}

/* ── 页面 ── */
#pages{position:fixed;top:var(--nav-h);bottom:var(--tab-h);left:0;right:0}
.page{display:none;height:100%;overflow-y:auto;-webkit-overflow-scrolling:touch}
.page.active{display:block;animation:fadeIn .18s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.page-pad{padding:14px 16px 24px}

/* ── 底部 Tab 栏 ── */
#tabbar{
  position:fixed;bottom:0;left:0;right:0;z-index:40;
  height:var(--tab-h);padding-bottom:env(safe-area-inset-bottom);
  display:flex;background:rgba(249,249,249,.88);
  backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);
  border-top:.5px solid var(--line);
}
.tab{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  color:var(--text3);font-size:10px;font-weight:600;position:relative;
}
.tab svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tab.active{color:var(--blue)}
.tab .badge{
  position:absolute;top:4px;left:calc(50% + 6px);min-width:16px;height:16px;padding:0 4px;
  background:var(--red);color:#fff;border-radius:8px;font-size:10px;font-weight:700;
  display:none;align-items:center;justify-content:center;
}
.tab .badge.show{display:flex}

/* ── 卡片与行 ── */
.section{margin-bottom:14px}
.sec-label{font-size:12px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.6px;margin:0 6px 7px}
.card{background:var(--card);border-radius:var(--radius);box-shadow:0 1px 3px rgba(0,0,0,.05);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:11px 14px;min-height:46px}
.row + .row{border-top:.5px solid var(--line2)}
.row-icon{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0;color:#fff}
.row-icon svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.row-main{flex:1;min-width:0}
.row-title{font-size:15px;font-weight:600}
.row-sub{font-size:12.5px;color:var(--text2);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-val{font-size:15px;color:var(--text2);font-variant-numeric:tabular-nums;max-width:46%;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* 信号条 */
.sig{display:flex;align-items:flex-end;gap:2.5px;height:15px}
.sig i{width:3.5px;border-radius:1.5px;background:var(--text3)}
.sig i:nth-child(1){height:5px}.sig i:nth-child(2){height:8px}.sig i:nth-child(3){height:11px}.sig i:nth-child(4){height:15px}
.sig.on i{background:var(--text)}

/* ── 速率大数字 ── */
.rate-grid{display:flex;gap:12px}
.rate-box{flex:1;background:var(--card);border-radius:var(--radius);box-shadow:0 1px 3px rgba(0,0,0,.05);padding:13px 14px}
.rate-label{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--text2)}
.rate-label svg{width:13px;height:13px;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.dn svg{stroke:var(--green)} .up svg{stroke:var(--blue)}
.rate-num{font-size:24px;font-weight:700;letter-spacing:-.5px;font-variant-numeric:tabular-nums;margin-top:3px}
.rate-num small{font-size:12px;font-weight:600;color:var(--text2);margin-left:2px}

/* ── 开关 ── */
.switch{position:relative;width:50px;height:30px;flex-shrink:0}
.switch input{opacity:0;width:0;height:0}
.switch em{position:absolute;inset:0;background:rgba(120,120,128,.22);border-radius:15px;transition:.22s}
.switch em::after{content:'';position:absolute;top:2px;left:2px;width:26px;height:26px;border-radius:50%;background:#fff;
  box-shadow:0 2px 5px rgba(0,0,0,.2);transition:.22s}
.switch input:checked + em{background:var(--green)}
.switch input:checked + em::after{transform:translateX(20px)}

/* ── 短信 ── */
.conv{display:flex;align-items:center;gap:11px;padding:10px 14px;cursor:pointer}
.conv:active{background:var(--card2)}
.conv + .conv{border-top:.5px solid var(--line2)}
.avatar{width:40px;height:40px;border-radius:50%;color:#fff;font-size:16px;font-weight:700;
  display:flex;align-items:center;justify-content:center;flex-shrink:0}
.conv-main{flex:1;min-width:0}
.conv-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.conv-name{font-size:15.5px;font-weight:600}
.conv-time{font-size:12px;color:var(--text3);flex-shrink:0}
.conv-prev{font-size:13.5px;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}

/* 聊天页 */
#chat-page{display:none;position:fixed;top:var(--nav-h);bottom:var(--tab-h);left:0;right:0;z-index:45;background:var(--bg);flex-direction:column}
#chat-page.open{display:flex}
.chat-head{height:48px;display:flex;align-items:center;justify-content:space-between;padding:0 12px;
  background:rgba(242,242,247,.86);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:.5px solid var(--line2)}
.chat-head .title{font-size:16px;font-weight:700}
.chat-head .sub{font-size:11px;color:var(--text2)}
.icon-btn{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--blue)}
.icon-btn svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#chat-msgs{flex:1;overflow-y:auto;padding:14px 14px 8px;display:flex;flex-direction:column;gap:10px}
.bubble-row{display:flex;gap:8px;align-items:flex-end;max-width:82%}
.bubble-row.me{align-self:flex-end;flex-direction:row-reverse}
.bubble{padding:8px 12px;border-radius:18px;font-size:15.5px;word-break:break-word;white-space:pre-wrap;user-select:text}
.bubble-row.me .bubble{background:var(--bubble-out);color:#fff;border-bottom-right-radius:5px}
.bubble-row:not(.me) .bubble{background:var(--bubble-in);color:var(--text);border-bottom-left-radius:5px}
.bubble-time{font-size:10.5px;color:var(--text3);flex-shrink:0}
#chat-inputbar{display:flex;gap:8px;padding:8px 12px calc(8px + env(safe-area-inset-bottom));background:rgba(249,249,249,.94);border-top:.5px solid var(--line2)}
#chat-input{flex:1;border:none;background:#fff;border-radius:18px;padding:9px 14px;font-size:15.5px;outline:none}
.send-btn{background:var(--blue);color:#fff;border-radius:18px;padding:0 16px;font-size:15px;font-weight:600}

/* 新建短信 */
.modal-mask{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:60;display:none;align-items:flex-end;justify-content:center}
.modal-mask.open{display:flex}
.modal{background:var(--card);border-radius:14px 14px 0 0;width:100%;max-width:500px;padding:18px 18px calc(18px + env(safe-area-inset-bottom))}
.modal h3{font-size:17px;font-weight:700;text-align:center;margin-bottom:14px}
.modal input{width:100%;border:.5px solid var(--line);border-radius:10px;padding:11px 12px;font-size:16px;margin-bottom:10px;outline:none;background:var(--card2)}
.modal-btns{display:flex;gap:10px;margin-top:4px}
.btn{flex:1;padding:11px;border-radius:10px;font-size:15.5px;font-weight:600;text-align:center;background:rgba(120,120,128,.14)}
.btn.primary{background:var(--blue);color:#fff}
.btn.danger{background:rgba(255,59,48,.12);color:var(--red)}

/* ── 通话 ── */
.dial-out{text-align:center;padding:6px 0 2px}
#dialNum{font-size:30px;font-weight:600;letter-spacing:1px;min-height:42px;font-variant-numeric:tabular-nums}
#dialNum .ph{color:var(--text3);font-weight:400}
.dial-hint{font-size:12.5px;color:var(--text2);margin-top:2px}
.dial-pad{display:grid;grid-template-columns:repeat(3,1fr);gap:14px 22px;padding:18px 30px;justify-items:center}
.dkey{width:72px;height:72px;border-radius:50%;background:rgba(120,120,128,.12);
  display:flex;flex-direction:column;align-items:center;justify-content:center;user-select:none}
.dkey:active{background:rgba(120,120,128,.3)}
.dkey b{font-size:28px;font-weight:400;line-height:1}
.dkey span{font-size:10px;font-weight:700;color:var(--text2);letter-spacing:1.5px;margin-top:2px}
.dial-actions{display:flex;align-items:center;justify-content:center;gap:34px;padding:6px 0 4px}
.call-btn{width:66px;height:66px;border-radius:50%;background:var(--green);color:#fff;
  display:flex;align-items:center;justify-content:center;box-shadow:0 4px 12px rgba(52,199,89,.35)}
.call-btn svg{width:28px;height:28px;fill:currentColor}
.mini-btn{width:44px;height:44px;border-radius:50%;background:rgba(120,120,128,.12);
  display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;color:var(--text2)}

/* 通话中横幅 */
#call-banner{position:fixed;top:calc(var(--nav-h) + 8px);left:14px;right:14px;z-index:55;
  background:var(--card);border-radius:14px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:13px 16px;
  display:none;align-items:center;gap:12px}
#call-banner.show{display:flex}
.pulse{width:10px;height:10px;border-radius:50%;background:var(--green);animation:pulse 1.2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(52,199,89,.5)}70%{box-shadow:0 0 0 9px rgba(52,199,89,0)}100%{box-shadow:0 0 0 0 rgba(52,199,89,0)}}

/* 来电浮层 */
#incoming{position:fixed;inset:0;z-index:70;background:linear-gradient(180deg,#2b2b31,#1a1a1f);
  display:none;flex-direction:column;align-items:center;justify-content:space-between;
  padding:calc(env(safe-area-inset-top) + 70px) 24px calc(env(safe-area-inset-bottom) + 56px);color:#fff}
#incoming.open{display:flex}
.inc-label{font-size:14px;font-weight:600;color:rgba(255,255,255,.65);letter-spacing:1px}
.inc-num{font-size:34px;font-weight:600;margin-top:10px}
.inc-actions{display:flex;gap:64px}
.inc-btn{width:76px;height:76px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px}
.inc-btn svg{width:30px;height:30px;fill:currentColor}
.inc-btn span{font-size:12px;font-weight:600;color:rgba(255,255,255,.85)}
.inc-btn.answer{background:var(--green);box-shadow:0 6px 20px rgba(52,199,89,.4)}
.inc-btn.decline{background:var(--red);box-shadow:0 6px 20px rgba(255,59,48,.4)}

/* ── AT 控制台 ── */
#atLog{background:#1d1d1f;color:#e8e8ed;border-radius:10px;padding:10px 12px;font:11.5px/1.6 "SF Mono",Menlo,monospace;
  height:150px;overflow-y:auto;white-space:pre-wrap;word-break:break-all;user-select:text}
.at-row{display:flex;gap:8px;padding:10px 12px}
#atInput{flex:1;border:.5px solid var(--line);border-radius:9px;padding:9px 12px;font:13px "SF Mono",Menlo,monospace;outline:none;background:var(--card2)}
.at-quick{display:flex;gap:7px;flex-wrap:wrap;padding:0 12px 12px}
.chip{font-size:12px;font-weight:600;padding:6px 11px;border-radius:999px;background:rgba(0,122,255,.1);color:var(--blue)}

/* ── 锁屏 ── */
#lock{position:fixed;inset:0;z-index:90;background:var(--bg);display:none;align-items:center;justify-content:center;flex-direction:column;gap:16px}
#lock.open{display:flex}
#lock .lk-logo{width:64px;height:64px;border-radius:15px;box-shadow:0 6px 20px rgba(0,0,0,.12)}
#lock .lk-title{font-size:18px;font-weight:700}
#lock .lk-sub{font-size:13px;color:var(--text2)}
#pinInput{width:200px;text-align:center;letter-spacing:8px;font-size:22px;border:.5px solid var(--line);
  border-radius:12px;padding:11px;background:#fff;outline:none}

/* ── Toast ── */
#toast{position:fixed;left:50%;bottom:calc(var(--tab-h) + 30px);transform:translateX(-50%) translateY(12px);
  background:rgba(28,28,30,.88);color:#fff;font-size:13.5px;font-weight:500;padding:9px 18px;border-radius:999px;
  opacity:0;pointer-events:none;transition:.22s;z-index:99;max-width:80%;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* 空态 */
.empty{padding:44px 16px;text-align:center;color:var(--text3);font-size:14px}
</style>

<div id="lock" data-page-node-id="CJq1p5A7KcYs2dPEyPzVWk">

<div id="toast" data-page-node-id="83EmVFFOFXS7CS2CF1bSEm"></div>

<script>
'use strict';
var $ = function(id){ return document.getElementById(id); };
var esc = function(s){ var d=document.createElement('div'); d.textContent=s==null?'':String(s); return d.innerHTML; };

/* ═══════════ PIN 鉴权 ═══════════ */
async function api(path, opt){
  try{
    var r = await fetch(path, opt || {});
    if(r.status === 401){ $('lock').classList.add('open'); return { ok:false, error:'需要 PIN' }; }
    return await r.json();
  }catch(e){ return { ok:false, error:String(e) }; }
}
async function doPinLogin(){
  var pin = $('pinInput').value.trim();
  if(!pin) return;
  var d = await api('/api/pin-login', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({pin:pin}) });
  if(d.ok){ $('lock').classList.remove('open'); toast('已解锁'); }
  else toast('PIN 不正确');
}
$('pinInput').addEventListener('keydown', function(e){ if(e.key==='Enter') doPinLogin(); });

/* ═══════════ 工具 ═══════════ */
function toast(msg){
  var t = $('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(t._h); t._h = setTimeout(function(){ t.classList.remove('show'); }, 2200);
}
function fmtKB(kb){
  if(kb==null||isNaN(kb))return'—';
  if(kb<1024)return Math.round(kb)+' KB';
  if(kb<1048576)return (kb/1024).toFixed(1)+' MB';
  if(kb<1073741824)return (kb/1048576).toFixed(2)+' GB';
  return (kb/1073741824).toFixed(2)+' TB';
}
function fmtRate(kb){
  if(kb==null||isNaN(kb))return['0','KB/s'];
  if(kb<1024)return[String(Math.round(kb)),'KB/s'];
  return[(kb/1024).toFixed(1),'MB/s'];
}
function fmtDur(sec){
  sec = Math.max(0, Math.floor(sec||0));
  var m = Math.floor(sec/60), s = sec%60;
  if(m>=60){ var h=Math.floor(m/60); m=m%60; return h+':'+String(m).padStart(2,'0')+':'+String(s).padStart(2,'0'); }
  return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
}
function avatarColor(key){
  var hues=[211,151,16,341,261,181,91,31], h=0;
  for(var i=0;i<key.length;i++) h=(h*31+key.charCodeAt(i))>>>0;
  return 'hsl('+hues[h%hues.length]+',62%,52%)';
}
function contactName(num){ return (contactMap && contactMap[num]) || num; }

/* ═══════════ Tab 切换 ═══════════ */
var curTab = 'status';
function switchTab(tab){
  curTab = tab;
  document.querySelectorAll('.tab').forEach(function(t){ t.classList.toggle('active', t.dataset.tab===tab); });
  document.querySelectorAll('.page').forEach(function(p){ p.classList.toggle('active', p.id==='page-'+tab); });
  if(tab==='status'){ refreshStatus(); refreshSpeed(); }
  if(tab==='sms'){ refreshSms(); }
  if(tab==='call'){ refreshCallHistory(); refreshCall(); loadContacts(); }
  if(tab==='more'){ loadGps(); loadContacts(); }
}

/* ═══════════ 状态 ═══════════ */
async function refreshStatus(){
  try{
    var d = await api('/api/status');
    var s = d.data || {};
    var pill = $('net-pill');
    if(s.connected){ pill.className='pill ok'; $('net-pill-text').textContent = s.operator_name || '已连接'; }
    else{ pill.className='pill bad'; $('net-pill-text').textContent='模块未连接'; }
    var dbm = s.signal_dbm;
    var level = 0;
    if(dbm!=null) level = dbm>-85?4:dbm>-95?3:dbm>-105?2:1;
    var bars = $('sig-bars');
    bars.classList.toggle('on', level>0);
    bars.querySelectorAll('i').forEach(function(el,i){ el.style.background = i<level ? 'var(--text)' : 'var(--text3)'; });
    $('sig-dbm').textContent = dbm!=null? dbm+' dBm' : '—';
    $('sig-op').textContent = s.operator_name || '—';
    $('st-sim').textContent = (s.sim_status||'').split('\n')[0].replace('CPIN:','').trim() || '—';
    $('st-model').textContent = s.model || '—';
    $('st-imei').textContent = s.imei || '—';
    $('st-smssc').textContent = (s.sms_center||'').replace('+CSCA:','').trim() || '—';
  }catch(e){}
}

/* ═══════════ 流量 ═══════════ */
async function refreshSpeed(){
  try{
    var d = await api('/api/speed');
    var s = d.data || {};
    if(!s.ok) return;
    var dn = fmtRate(s.down), up = fmtRate(s.up);
    $('rate-down').textContent = dn[0]; $('rate-down-u').textContent = dn[1];
    $('rate-up').textContent = up[0]; $('rate-up-u').textContent = up[1];
    $('tu-today').textContent = fmtKB((s.today&&s.today.recv_kb||0)+(s.today&&s.today.sent_kb||0));
    $('tu-month').textContent = fmtKB((s.month&&s.month.recv_kb||0)+(s.month&&s.month.sent_kb||0));
    $('tu-total').textContent = fmtKB((s.rx_total_kb||0)+(s.tx_total_kb||0));
  }catch(e){}
}
async function resetUsage(){
  if(!confirm('将同时清零模块计数器与日/月统计，且不可恢复。确定？')) return;
  await api('/api/data-usage/reset', { method:'POST' });
  toast('流量统计已清零'); refreshSpeed();
}

/* ═══════════ 短信 ═══════════ */
var smsCache = [], curConv = null, contactMap = {};
function peerOf(m){ return m.direction==='sent' ? m.receiver : m.sender; }

async function loadContacts(){
  try{
    var d = await api('/api/contacts');
    if(d.ok && Array.isArray(d.contacts)){
      contactMap = {};
      d.contacts.forEach(function(c){ if(c.number) contactMap[String(c.number).replace(/\s/g,'')] = c.name; });
    }
  }catch(e){}
}
async function refreshSms(){
  try{
    var d = await api('/api/sms');
    smsCache = (d.data && (d.data.messages || d.data.sms)) || [];
    smsCache.sort(function(a,b){ return String(b.timestamp).localeCompare(String(a.timestamp)); });
    renderConvs();
    renderBadge();
    if(curConv) renderChat();
  }catch(e){}
}
function renderBadge(){
  var now = Date.now();
  var fresh = smsCache.filter(function(m){
    if(m.direction!=='received') return false;
    var t = new Date(String(m.timestamp).replace(/-/g,'/')).getTime();
    return isFinite(t) && now-t < 10*60*1000;
  }).length;
  var b = $('sms-badge');
  b.classList.toggle('show', fresh>0);
  b.textContent = fresh;
}
function renderConvs(){
  var map = {};
  for(var i=0;i<smsCache.length;i++){
    var m = smsCache[i], p = peerOf(m);
    if(!p) continue;
    if(!map[p]) map[p] = { peer:p, last:m };
  }
  var convs = Object.values(map).sort(function(a,b){ return String(b.last.timestamp).localeCompare(String(a.last.timestamp)); });
  var el = $('conv-list');
  if(!convs.length){ el.innerHTML = '<div class="empty">暂无短信</div>'; return; }
  el.innerHTML = convs.map(function(c){
    var name = contactName(c.peer);
    var dirTag = c.last.direction==='sent' ? '<span style="color:var(--text3)">[发]</span> ' : '';
    return '<div class="conv" onclick="openChat(\''+esc(c.peer).replace(/'/g,"\\'")+'\')">'
      + '<div class="avatar" style="background:'+avatarColor(c.peer)+'">'+esc(name[0]||'#').toUpperCase()+'</div>'
      + '<div class="conv-main"><div class="conv-top"><span class="conv-name">'+esc(name)+'</span>'
      + '<span class="conv-time">'+esc(String(c.last.timestamp||'').slice(5,16))+'</span></div>'
      + '<div class="conv-prev">'+dirTag+esc(String(c.last.content||'').slice(0,32))+'</div></div></div>';
  }).join('');
}
function openChat(peer){
  curConv = peer;
  var name = contactName(peer);
  $('chat-peer').textContent = name;
  $('chat-peer-sub').textContent = name!==peer ? peer : '';
  renderChat();
  $('chat-page').classList.add('open');
}
function closeChat(){ $('chat-page').classList.remove('open'); curConv = null; }
function renderChat(){
  var box = $('chat-msgs');
  var msgs = smsCache.filter(function(m){ return peerOf(m)===curConv; })
    .sort(function(a,b){ return String(a.timestamp).localeCompare(String(b.timestamp)); });
  var name = contactName(curConv);
  box.innerHTML = msgs.map(function(m){
    var me = m.direction==='sent';
    return '<div class="bubble-row'+(me?' me':'')+'">'
      + '<div class="bubble">'+esc(m.content)+'</div>'
      + '<div class="bubble-time">'+esc(String(m.timestamp||'').slice(11,16))+'</div></div>';
  }).join('');
  box.scrollTop = box.scrollHeight;
}
$('chat-input').addEventListener('keydown', function(e){ if(e.key==='Enter') sendChat(); });
async function sendChat(){
  var text = $('chat-input').value.trim();
  if(!text || !curConv) return;
  $('chat-input').value = '';
  var d = await api('/api/sms/send', { method:'POST', headers:{'Content-Type':'application/json'},
    body:JSON.stringify({ phone:curConv, message:text }) });
  if(d.data && d.data.ok){ toast('已发送'); await refreshSms(); renderChat(); }
  else{ toast('发送失败：'+((d.data&&(d.data.error||d.data.detail))||'未知错误'), false); $('chat-input').value = text; }
}
async function deleteConv(){
  if(!curConv) return;
  var peer = curConv;
  if(!confirm('删除与 '+contactName(peer)+' 的全部短信？')) return;
  var targets = smsCache.filter(function(m){ return peerOf(m)===peer; });
  for(var i=0;i<targets.length;i++){
    await api('/api/sms/'+targets[i].id, { method:'DELETE' }).catch(function(){});
  }
  closeChat();
  toast('会话已删除');
  refreshSms();
}
function openNewSms(){ $('newSmsMask').classList.add('open'); $('newSmsPhone').focus(); }
function closeNewSms(){ $('newSmsMask').classList.remove('open'); $('newSmsPhone').value=''; $('newSmsText').value=''; }
async function submitNewSms(){
  var phone = $('newSmsPhone').value.trim(), text = $('newSmsText').value.trim();
  if(!phone || !text){ toast('请填写号码和内容'); return; }
  var d = await api('/api/sms/send', { method:'POST', headers:{'Content-Type':'application/json'},
    body:JSON.stringify({ phone:phone, message:text }) });
  if(d.data && d.data.ok){ toast('已发送'); closeNewSms(); openChat(phone); refreshSms(); }
  else toast('发送失败：'+((d.data&&(d.data.error||d.data.detail))||'未知错误'));
}
$('newSmsMask').addEventListener('click', function(e){ if(e.target===this) closeNewSms(); });

/* ═══════════ 通话 ═══════════ */
var dialInput = '';
var DIAL_KEYS = [['1',''],['2','ABC'],['3','DEF'],['4','GHI'],['5','JKL'],['6','MNO'],['7','PQRS'],['8','TUV'],['9','WXYZ'],['*',''],['0','+'],['#','']];
(function(){
  var pad = $('dialPad');
  pad.innerHTML = DIAL_KEYS.map(function(k){
    return '<div class="dkey" onclick="dialKey(\''+k[0]+'\')"><b>'+k[0]+'</b>'+(k[1]?'<span>'+k[1]+'</span>':'')+'</div>';
  }).join('');
})();
function renderDial(){
  var el = $('dialNum');
  if(!dialInput){ el.innerHTML = '<span class="ph">输入号码</span>'; $('dialHint').textContent=''; return; }
  var name = contactMap[dialInput];
  el.textContent = dialInput;
  $('dialHint').textContent = name ? name : '';
}
function dialKey(k){ if(dialInput.length<20){ dialInput += k; renderDial(); } }
function dialBack(){ dialInput = dialInput.slice(0,-1); renderDial(); }
function clearDial(){ dialInput=''; renderDial(); }
async function dialNow(){
  var num = dialInput.trim();
  if(!num){ toast('请输入号码'); return; }
  var d = await api('/api/call/dial', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({number:num}) });
  if(d.data && d.data.ok) toast('正在拨打 '+num);
  else toast('拨号失败：'+((d.data&&d.data.error)||''));
}
async function hangup(){
  await api('/api/call/hangup', { method:'POST' }).catch(function(){});
  $('incoming').classList.remove('open');
}
async function answerCall(){
  await api('/api/call/answer', { method:'POST' }).catch(function(){});
  $('incoming').classList.remove('open');
}
var lastCallState = 'idle';
async function refreshCall(){
  try{
    var d = await api('/api/call/status');
    var c = (d.data && d.data.call) || {};
    var st = c.state || 'idle';
    if(st==='ringing' && c.direction==='in'){
      $('inc-num').textContent = contactName(c.number) || '未知号码';
      $('incoming').classList.add('open');
    } else {
      $('incoming').classList.remove('open');
    }
    var banner = $('call-banner');
    if(st!=='idle'){
      banner.classList.add('show');
      var map = { ringing: c.direction==='in'?'来电':'呼入等待', dialing:'拨号中', alerting:'对方振铃', active:'通话中' };
      $('cb-state').textContent = map[st]||st;
      $('cb-num').textContent = contactName(c.number) || c.number || '未知号码';
      $('cb-dur').textContent = st==='active' ? fmtDur(c.duration||0) : '';
    } else {
      banner.classList.remove('show');
    }
    if(lastCallState!=='idle' && st==='idle') refreshCallHistory();
    lastCallState = st;
  }catch(e){}
}
async function refreshCallHistory(){
  try{
    var d = await api('/api/call/history');
    var records = (d.data && d.data.records) || [];
    var el = $('call-history');
    if(!records.length){ el.innerHTML = '<div class="empty">暂无通话记录</div>'; return; }
    el.innerHTML = records.slice(0,60).map(function(rec){
      var missed = rec.type==='missed';
      var label = missed?'未接':rec.type==='incoming'?'呼入':'呼出';
      var dur = rec.duration>0 ? ' · '+fmtDur(rec.duration) : '';
      var color = missed?'var(--red)':rec.direction==='in'?'var(--green)':'var(--blue)';
      var name = contactName(rec.number) || rec.number || '未知号码';
      return '<div class="row">'
        + '<div class="row-icon" style="background:'+color+'"><svg viewBox="0 0 24 24"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.91.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92z"/></svg></div>'
        + '<div class="row-main"><div class="row-title"'+(missed?' style="color:var(--red)"':'')+'>'+esc(name)+'</div>'
        + '<div class="row-sub">'+label+dur+'</div></div>'
        + '<div class="row-val" style="font-size:12.5px;color:var(--text3)">'+esc(String(rec.timestamp||'').slice(5,16))+'</div>'
        + '<button class="mini-btn" style="background:rgba(52,199,89,.12);color:var(--green);width:38px;height:38px" onclick="redial(\''+esc(rec.number||'').replace(/'/g,"\\'")+'\')"><svg style="width:16px;height:16px;fill:currentColor" viewBox="0 0 24 24"><path d="M6.62 10.79a15.05 15.05 0 0 0 6.59 6.59l2.2-2.2a1 1 0 0 1 1.02-.24 11.36 11.36 0 0 0 3.57.57 1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1 11.36 11.36 0 0 0 .57 3.57 1 1 0 0 1-.25 1.02z"/></svg></button>'
        + '</div>';
    }).join('');
  }catch(e){}
}
function redial(num){ if(!num) return; dialInput = num; renderDial(); dialNow(); }
async function clearCallHistory(){
  if(!confirm('确定删除全部通话记录？')) return;
  await api('/api/call/history', { method:'DELETE' });
  toast('通话记录已清空');
  refreshCallHistory();
}

/* ═══════════ GPS ═══════════ */
async function loadGps(){
  try{
    var d = await api('/api/gps');
    var g = (d.data && d.data.gps) || d.data || {};
    var on = !!(g.enabled || g.on || g.power_on);
    $('gpsSwitch').checked = on;
    $('gps-sub').textContent = on ? '已开启' : '已关闭';
    if(on && (g.lat || g.latitude)){
      $('gps-lat').textContent = (g.lat||g.latitude)+', '+(g.lon||g.longitude);
      $('gps-alt').textContent = (g.altitude||'—')+' m · '+(g.speed||'—')+' km/h';
      $('gps-sat').textContent = g.satellites!=null ? g.satellites : '—';
    } else {
      $('gps-lat').textContent = on ? '定位中…' : '—';
      $('gps-alt').textContent = '—'; $('gps-sat').textContent = '—';
    }
  }catch(e){}
}
async function gpsPower(on){
  var d = await api('/api/gps/power', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({on:on}) });
  if(d.ok===false && d.error==='需要 PIN'){ $('gpsSwitch').checked = !on; return; }
  toast(on ? 'GPS 已开启' : 'GPS 已关闭（固件可能不支持关闭）');
  setTimeout(loadGps, 1200);
}

/* ═══════════ AT 调试台 ═══════════ */
function atLog(line, isCmd){
  var el = $('atLog');
  var t = new Date().toTimeString().slice(0,8);
  el.textContent += (isCmd? '\n['+t+'] › '+line : line+'\n');
  while(el.textContent.length > 8000) el.textContent = el.textContent.slice(el.textContent.indexOf('\n')+1);
  el.scrollTop = el.scrollHeight;
}
async function sendAt(cmd){
  cmd = (cmd!=null?cmd:$('atInput').value).trim();
  if(!cmd) return;
  $('atInput').value = '';
  atLog(cmd, true);
  var d = await api('/api/at', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({command:cmd}) });
  var resp = d.data ? (d.data.response||d.data.raw||'') : (d.error||String(d));
  atLog(String(resp));
}
function atQuick(cmd){ sendAt(cmd); }
$('atInput').addEventListener('keydown', function(e){ if(e.key==='Enter') sendAt(); });

/* ═══════════ 主循环 ═══════════ */
refreshStatus(); refreshSpeed(); refreshCall();
setInterval(function(){
  refreshSpeed();
  refreshStatus();
  refreshCall();
  if(curTab==='sms') refreshSms();
  if($('incoming').classList.contains('open')) loadGps();
}, 3000);
loadContacts().then(function(){ if(curTab==='call') refreshCallHistory(); });
atLog('AT 控制台就绪，输入 AT 命令后回车发送');
</script>
